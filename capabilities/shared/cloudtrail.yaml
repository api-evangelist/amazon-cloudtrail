naftiko: "1.0.0-alpha1"

info:
  label: "Amazon CloudTrail"
  description: "API for creating and managing CloudTrail trails, event data stores, and channels for capturing AWS API activity and storing audit logs."
  tags:
    - Amazon Web Services
    - Amazon CloudTrail
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: cloudtrail
      baseUri: https://cloudtrail.us-east-1.amazonaws.com
      description: "Amazon CloudTrail API."
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources: []

  exposes:
    - type: rest
      port: 8100
      namespace: cloudtrail-rest
      resources: []

    - type: mcp
      port: 9100
      namespace: cloudtrail-mcp
      transport: http
      tools: []
