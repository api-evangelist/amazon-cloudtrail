modified: '2026-03-16'
apis:
- name: Amazon CloudTrail API
  description: >-
    API for recording and monitoring AWS API calls made on your account.
    CloudTrail provides event history of API activity, enabling security
    analysis, resource change tracking, and compliance auditing. Supports
    creating and managing trails, looking up events, querying event data
    stores, and configuring insights.
